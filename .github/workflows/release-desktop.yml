name: Release Windows Desktop

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and package version
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expected = "v$($package.version)"
          $actual = "${{ github.ref_name }}"

          if ($actual -ne $expected) {
            throw "Tag $actual does not match package version $expected."
          }

      - name: Validate backend
        run: npm run validate:backend

      - name: Validate release source
        run: npm run validate:v120

      - name: Build Windows desktop
        run: npm run build:desktop

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = $package.version
          $exe = "release\SRSB-Work-Management-Setup-$version.exe"
          $blockmap = "$exe.blockmap"

          if (-not (Test-Path $exe)) {
            throw "Installer not found: $exe"
          }

          $assets = @($exe)
          if (Test-Path $blockmap) {
            $assets += $blockmap
          }

          gh release create "${{ github.ref_name }}" `
            @assets `
            --verify-tag `
            --title "SRSB Work Management ${{ github.ref_name }}" `
            --notes-file "RELEASE-NOTES.md"
