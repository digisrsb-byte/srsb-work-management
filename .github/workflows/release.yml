name: Build and Publish Desktop Update

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate version 1.2.0 source
        run: npm run validate:v120

      - name: Build Windows installer
        run: npm run build:desktop

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/SRSB-Work-Management-Setup-*.exe
            release/SRSB-Work-Management-Setup-*.exe.blockmap
